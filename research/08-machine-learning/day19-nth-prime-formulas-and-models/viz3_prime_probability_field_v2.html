<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Probability Field</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a; /* Very dark background */
        }
        .field-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 4px;
        }
        .cell {
            width: 100%;
            padding-bottom: 100%; /* Creates a square aspect ratio */
            position: relative;
            border-radius: 4px;
            transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
        }
        .cell-content {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }
        .cell:hover {
            transform: scale(1.2);
            z-index: 10;
        }
        .is-prime {
            color: #ffffff;
            font-weight: bold;
            text-shadow: 0 0 8px #fff, 0 0 12px #0ff, 0 0 16px #0ff;
            animation: pulse-cyan 2s infinite;
        }
        /* New style for wrongly predicted numbers */
        .is-wrong {
            color: #ffffff;
            text-shadow: 0 0 8px #fff, 0 0 12px #f00, 0 0 16px #f00;
            animation: pulse-red 3s infinite;
        }
        @keyframes pulse-cyan {
            0% { box-shadow: 0 0 4px #0ff; }
            50% { box-shadow: 0 0 16px #0ff; }
            100% { box-shadow: 0 0 4px #0ff; }
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 4px #f00; }
            50% { box-shadow: 0 0 16px #f00; }
            100% { box-shadow: 0 0 4px #f00; }
        }
        .tooltip {
            visibility: hidden;
            width: 160px;
            background-color: #1f2937;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 20;
            bottom: 125%;
            left: 50%;
            margin-left: -80px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .cell:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="text-gray-100">

    <div class="w-full max-w-6xl mx-auto p-6 md:p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-cyan-400">Prime Probability Field</h1>
            <p class="text-gray-400 mt-2">Visualizing the probability density of prime numbers based on P(n) ≈ 1/ln(n).</p>
        </div>

        <!-- Input Section -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-8 p-4 bg-gray-900/50 rounded-xl">
            <label for="n-input" class="text-lg font-medium">Visualize numbers up to:</label>
            <input type="number" id="n-input" value="200" min="10" max="1000" class="w-full sm:w-40 bg-gray-800 border border-gray-700 rounded-lg p-3 text-center text-lg focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition duration-200">
            <button id="generate-btn" class="w-full sm:w-auto bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:shadow-cyan-500/50 transform hover:-translate-y-0.5 transition-all duration-200 ease-in-out">
                Generate Field
            </button>
        </div>

        <!-- Field Container -->
        <div id="field-container" class="p-4 bg-black rounded-xl shadow-2xl">
            <div id="field-grid" class="field-grid"></div>
        </div>
    </div>

    <script>
        const nInput = document.getElementById('n-input');
        const generateBtn = document.getElementById('generate-btn');
        const fieldGrid = document.getElementById('field-grid');

        // --- Core Logic ---

        function isPrime(num) {
            if (num <= 1) return false;
            if (num <= 3) return true;
            if (num % 2 === 0 || num % 3 === 0) return false;
            for (let i = 5; i * i <= num; i = i + 6) {
                if (num % i === 0 || num % (i + 2) === 0) return false;
            }
            return true;
        }

        /**
         * Generates the prime probability field visualization.
         */
        function generateField() {
            const n = parseInt(nInput.value, 10);
            if (isNaN(n) || n <= 1) {
                alert("Please enter a number greater than 1.");
                return;
            }

            fieldGrid.innerHTML = '';
            
            const maxProbability = 1 / Math.log(2);
            // Define a threshold for what we consider a "high probability" for a non-prime.
            // A probability of 0.25 corresponds to numbers around 50.
            const WRONG_PREDICTION_THRESHOLD = 0.25;

            for (let i = 1; i <= n; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';

                const probability = i > 1 ? 1 / Math.log(i) : 0;
                const prime = isPrime(i);
                
                const content = document.createElement('div');
                content.className = 'cell-content';
                content.textContent = i;

                if (prime) {
                    // It's a prime number (True Positive)
                    content.classList.add('is-prime');
                    cell.style.backgroundColor = `hsl(180, 90%, 50%)`; // Bright cyan
                } else {
                    // It's a composite number. Check if it's a "false positive".
                    if (probability > WRONG_PREDICTION_THRESHOLD) {
                        content.classList.add('is-wrong');
                        cell.style.backgroundColor = `hsl(0, 80%, 50%)`; // Bright red
                    } else {
                        // Standard low-probability composite number
                        const normalizedProb = probability / maxProbability;
                        const lightness = 10 + (normalizedProb * 30); // Varies from 10% to 40%
                        cell.style.backgroundColor = `hsl(180, 80%, ${lightness}%)`; // Dim cyan
                    }
                }
                
                // Add a tooltip
                const tooltip = document.createElement('span');
                tooltip.className = 'tooltip';
                tooltip.innerHTML = `Num: ${i}<br>Prob: ${(probability * 100).toFixed(2)}%`;
                content.appendChild(tooltip);

                cell.appendChild(content);
                fieldGrid.appendChild(cell);
            }
        }

        // --- Event Listeners ---
        generateBtn.addEventListener('click', generateField);
        nInput.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                generateField();
            }
        });

        window.onload = generateField;

    </script>
</body>
</html>
