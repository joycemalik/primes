<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Prime Visualization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
        }
        .cell {
            width: 50px; /* Wider cells for better text display */
            height: 40px;
            position: relative;
            border-radius: 4px;
            transition: transform 0.2s ease-out;
        }
        .cell-content {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4); /* Dim by default */
        }
        .cell:hover {
            transform: scale(1.2);
            z-index: 10;
        }
        .is-prime .highlight {
            color: #ffffff;
            text-shadow: 0 0 8px #fff, 0 0 12px #0ff, 0 0 16px #0ff;
            animation: pulse-cyan 2s infinite;
        }
        /* New style for internal primes */
        .internal-prime .highlight {
            color: #ffffff;
            text-shadow: 0 0 8px #fff, 0 0 12px #facc15, 0 0 16px #facc15; /* Golden glow */
        }
        @keyframes pulse-cyan {
            0% { text-shadow: 0 0 4px #0ff, 0 0 8px #0ff; }
            50% { text-shadow: 0 0 16px #0ff, 0 0 24px #0ff; }
            100% { text-shadow: 0 0 4px #0ff, 0 0 8px #0ff; }
        }
        .tooltip {
            visibility: hidden;
            width: 160px;
            background-color: #1f2937;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 20;
            bottom: 125%;
            left: 50%;
            margin-left: -80px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .cell:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="text-gray-100">
    <div class="w-full max-w-6xl mx-auto p-6 md:p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-cyan-400">Internal Prime Visualization</h1>
            <p class="text-gray-400 mt-2">Highlighting the longest prime number sequence hidden within each number.</p>
        </div>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-8 p-4 bg-gray-900/50 rounded-xl">
            <label for="n-input" class="text-lg font-medium">Visualize up to:</label>
            <input type="number" id="n-input" value="200" min="11" max="1000" class="w-full sm:w-40 bg-gray-800 border border-gray-700 rounded-lg p-3 text-center text-lg focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition duration-200">
            <button id="generate-btn" class="w-full sm:w-auto bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:shadow-cyan-500/50 transform hover:-translate-y-0.5 transition-all duration-200 ease-in-out">
                Generate Field
            </button>
        </div>

        <div id="field-container" class="p-4 bg-black rounded-xl shadow-2xl">
            <div id="field-grid" class="flex justify-around gap-4">
                <!-- Columns will be generated here -->
            </div>
        </div>
    </div>

    <script>
        const nInput = document.getElementById('n-input');
        const generateBtn = document.getElementById('generate-btn');
        const fieldGrid = document.getElementById('field-grid');

        // --- Core Logic ---
        const primeCache = new Map();
        function isPrime(num) {
            if (num <= 1) return false;
            if (num <= 3) return true;
            if (primeCache.has(num)) return primeCache.get(num);
            if (num % 2 === 0 || num % 3 === 0) {
                primeCache.set(num, false);
                return false;
            }
            for (let i = 5; i * i <= num; i = i + 6) {
                if (num % i === 0 || num % (i + 2) === 0) {
                    primeCache.set(num, false);
                    return false;
                }
            }
            primeCache.set(num, true);
            return true;
        }

        /**
         * Finds the longest substring of a number's string representation that is prime.
         * @param {number} num The number to analyze.
         * @returns {string} The longest prime substring, or an empty string.
         */
        function findLongestPrimeSubstring(num) {
            const s = String(num);
            let longestPrime = "";
            for (let len = s.length; len > 0; len--) {
                for (let i = 0; i <= s.length - len; i++) {
                    const sub = s.substring(i, i + len);
                    if (isPrime(parseInt(sub, 10))) {
                        return sub; // Since we start with the longest possible length, the first one we find is the answer.
                    }
                }
            }
            return longestPrime;
        }

        function generateField() {
            const n = parseInt(nInput.value, 10);
            if (isNaN(n) || n < 11) {
                // A non-blocking message would be better, but for simplicity:
                console.error("Please enter a number greater than or equal to 11.");
                return;
            }

            fieldGrid.innerHTML = '';
            const lastDigits = [1, 3, 7, 9];
            const columns = {};
            lastDigits.forEach(digit => {
                const colWrapper = document.createElement('div');
                colWrapper.className = 'flex flex-col items-center gap-2';
                const header = document.createElement('h3');
                header.className = 'text-lg font-semibold text-gray-400 mb-2';
                header.textContent = `Ends in ${digit}`;
                colWrapper.appendChild(header);
                const colDiv = document.createElement('div');
                colDiv.className = 'flex flex-col gap-1';
                colWrapper.appendChild(colDiv);
                fieldGrid.appendChild(colWrapper);
                columns[digit] = colDiv;
            });

            for (let i = 11; i <= n; i++) {
                if (i % 2 === 0 || i % 5 === 0) continue;

                const lastDigit = i % 10;
                const targetColumn = columns[lastDigit];

                if (targetColumn) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const content = document.createElement('div');
                    content.className = 'cell-content';

                    const numStr = String(i);
                    const primeSub = findLongestPrimeSubstring(i);
                    const isNumPrime = primeSub === numStr;

                    if (isNumPrime) {
                        content.classList.add('is-prime');
                        content.innerHTML = `<span class="highlight">${numStr}</span>`;
                    } else if (primeSub) {
                        content.classList.add('internal-prime');
                        const index = numStr.indexOf(primeSub);
                        const prefix = numStr.substring(0, index);
                        const suffix = numStr.substring(index + primeSub.length);
                        content.innerHTML = `<span>${prefix}</span><span class="highlight">${primeSub}</span><span>${suffix}</span>`;
                    } else {
                        content.textContent = numStr;
                    }

                    const tooltip = document.createElement('span');
                    tooltip.className = 'tooltip';
                    tooltip.innerHTML = `Number: ${i}<br>Longest Prime: ${primeSub || 'None'}`;
                    content.appendChild(tooltip);
                    
                    cell.appendChild(content);
                    targetColumn.appendChild(cell);
                }
            }
        }

        generateBtn.addEventListener('click', generateField);
        nInput.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') generateField();
        });

        window.onload = generateField;
    </script>
</body>
</html>
